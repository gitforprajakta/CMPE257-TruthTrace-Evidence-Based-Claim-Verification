<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · TruthTrace</title>
  <link rel="stylesheet" href="assets/style.css?v=4">
  <script>
    try {
      var savedTheme = localStorage.getItem("truthtrace-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (error) {}
  </script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="brand">
      <a href="index.html">TruthTrace</a>
    </div>
    <nav aria-label="Primary">
      {% for item in nav %}
      <a href="{{ item.href }}" {% if item.href == active %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <button type="button" id="theme-toggle" class="theme-toggle">Dark mode</button>
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>CMPE 257 · decision support, not a truth oracle.</p>
  </footer>
  <script src="assets/tabs.js"></script>
  <script src="assets/interact.js?v=3"></script>
</body>
</html>
